
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紫星聊天室</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;
background:#f6f1ff;color:#352747}
button,input{font:inherit}
button{border:0;border-radius:12px;padding:11px 14px;
background:#9870d8;color:white;cursor:pointer}
button:hover{filter:brightness(.96)}
input{width:100%;padding:12px;border:1px solid #ded3ee;
border-radius:12px;outline-color:#a88be0}
.panel{background:white;border-radius:20px;padding:22px;
box-shadow:0 8px 30px #55347712}
#auth{max-width:420px;margin:8vh auto;padding:18px}
#auth h1{text-align:center;color:#8861c6}
.tabs{display:flex;gap:8px;margin:16px 0}
.tabs button{flex:1}
.field{margin:12px 0}
.field label{display:block;font-size:14px;margin-bottom:6px}
a{color:#8059bd;cursor:pointer}
#app{display:none;height:100dvh;gap:0}
.sidebar{width:290px;background:white;padding:18px;
display:flex;flex-direction:column;gap:12px;overflow:auto}
.brand{font-size:23px;font-weight:800;color:#8b65c5}
.room{padding:12px;border-radius:12px;cursor:pointer;
overflow-wrap:anywhere}
.room.active,.room:hover{background:#f0e8ff}
.room small{display:block;color:#8d7b9d;margin-top:4px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:white;padding:16px 20px;border-bottom:1px solid #eee}
#messages{flex:1;overflow-y:auto;padding:20px;
display:flex;flex-direction:column;gap:12px}
.msg{background:white;border-radius:14px;padding:12px 14px;
max-width:min(85%,520px);overflow-wrap:anywhere;align-self:flex-start}
.msg.mine{align-self:flex-end;background:#e9ddff}
.meta{font-size:12px;color:#8a7899;margin-bottom:5px}
.content{white-space:pre-wrap;overflow-wrap:anywhere}
.sendbar{display:flex;gap:8px;padding:14px;background:white}
.sendbar input{flex:1;min-width:0}
.small{font-size:13px;color:#81728d}
#notice{padding:0 18px;color:#a04a68;font-size:14px}
@media(max-width:650px){
#app{height:100dvh}
.sidebar{width:125px;padding:9px;gap:8px}
.sidebar button{padding:9px 5px;font-size:12px}
.room{padding:9px 5px;font-size:13px}
.brand{font-size:17px}
.top{padding:12px}
#messages{padding:12px}
.msg{max-width:94%}
.sendbar{padding:9px}
}
</style>
</head>
<body>

<section id="auth">
  <div class="panel">
    <h1>✦ 紫星聊天室</h1>
    <p class="small" style="text-align:center">
      和朋友一起聊天，收藏每一段回憶
    </p>
    <div class="tabs">
      <button onclick="showAuth('login')">登入</button>
      <button onclick="showAuth('signup')">註冊</button>
    </div>
    <form id="authForm">
      <div class="field" id="nameField" hidden>
        <label>暱稱</label>
        <input id="nickname" maxlength="40" placeholder="輸入你的暱稱">
      </div>
      <div class="field">
        <label>電子郵件（登入帳號）</label>
        <input id="email" type="email" autocomplete="email"
        required placeholder="name@example.com">
      </div>
      <div class="field">
        <label>密碼</label>
        <input id="password" type="password"
        autocomplete="current-password" minlength="8"
        required placeholder="至少 8 個字元">
      </div>
      <button id="authSubmit" style="width:100%">登入</button>
    </form>
    <p style="text-align:center;font-size:14px">
      <a onclick="forgotPassword()">忘記密碼？</a>
    </p>
    <div id="authMsg" class="small"></div>
  </div>
</section>

<section id="reset" hidden style="max-width:420px;margin:8vh auto;padding:18px">
  <div class="panel">
    <h2>設定新密碼</h2>
    <form id="resetForm">
      <div class="field">
        <label>新密碼（至少 8 個字元）</label>
        <input id="newPassword" type="password" minlength="8" required>
      </div>
      <button style="width:100%">更新密碼</button>
    </form>
    <p id="resetMsg" class="small"></p>
  </div>
</section>

<section id="app">
  <aside class="sidebar">
    <div class="brand">✦ 紫星</div>
    <div id="myName" class="small"></div>
    <button onclick="createRoom()">＋ 建立聊天室</button>
    <button onclick="joinRoom()">⌁ 輸入代碼加入</button>
    <div class="small">我的聊天室</div>
    <div id="roomList"></div>
    <div style="margin-top:auto">
      <button onclick="logout()" style="width:100%">登出</button>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <strong id="roomTitle">選擇一個聊天室</strong>
      <div id="roomCode" class="small"></div>
    </header>
    <div id="notice"></div>
    <div id="messages"></div>
    <form id="sendForm" class="sendbar">
      <input id="messageInput" maxlength="5000"
      placeholder="輸入訊息……" autocomplete="off" disabled>
      <button id="sendBtn" disabled>傳送</button>
    </form>
  </main>
</section>

<script>
// 先到 Supabase 專案設定，填入自己的資料
const SUPABASE_URL = 'https://onzsburncumjmpespdki.supabase.co';
const SUPABASE_KEY = 'sb_publishable_NMckuglyW8Q5tPoV9Fjl6g_bcH8yIv4';

const db = window.supabase.createClient(
  SUPABASE_URL, SUPABASE_KEY
);

let user = null;
let currentRoom = null;
let mode = 'login';
let channel = null;
let loadingMessages = false;

const $ = id => document.getElementById(id);

function say(id, text) {
  $(id).textContent = text || '';
}

function showAuth(next) {
  mode = next;
  $('nameField').hidden = next !== 'signup';
  $('authSubmit').textContent =
    next === 'signup' ? '建立帳號' : '登入';
  $('password').autocomplete =
    next === 'signup' ? 'new-password' : 'current-password';
  say('authMsg', '');
}

function showNotice(text) {
  say('notice', text);
}

function randomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const bytes = crypto.getRandomValues(new Uint8Array(8));
  return Array.from(bytes, b => chars[b % chars.length]).join('');
}

async function init() {
  // 密碼重設連結會回到此網頁並帶有 recovery session
  const {data:{session}} = await db.auth.getSession();
  const recovery = location.hash.includes('type=recovery');

  if (recovery && session) {
    $('auth').hidden = true;
    $('reset').hidden = false;
    return;
  }

  if (session) {
    user = session.user;
    await enterApp();
  }

  db.auth.onAuthStateChange(async (event, session) => {
    if (event === 'PASSWORD_RECOVERY') {
      $('auth').hidden = true;
      $('app').style.display = 'none';
      $('reset').hidden = false;
      return;
    }
    if (session && !user) {
      user = session.user;
      await enterApp();
    } else if (!session) {
      user = null;
      $('app').style.display = 'none';
      $('auth').hidden = false;
    }
  });
}

$('authForm').addEventListener('submit', async e => {
  e.preventDefault();
  say('authMsg', '處理中……');

  const email = $('email').value.trim();
  const password = $('password').value;

  let result;
  if (mode === 'signup') {
    const nickname = $('nickname').value.trim() || email.split('@')[0];
    result = await db.auth.signUp({
      email, password,
      options:{data:{nickname}}
    });
    if (!result.error && !result.data.session) {
      say('authMsg', '註冊成功！請先查看電子郵件完成驗證，再登入。');
      return;
    }
  } else {
    result = await db.auth.signInWithPassword({email,password});
  }

  if (result.error) {
    say('authMsg', result.error.message);
    return;
  }

  user = result.data.user;
  if (user) await enterApp();
});

async function forgotPassword() {
  const email = $('email').value.trim();
  if (!email) {
    say('authMsg', '請先輸入註冊時使用的電子郵件。');
    $('email').focus();
    return;
  }

  const {error} = await db.auth.resetPasswordForEmail(email, {
    redirectTo: location.origin + location.pathname
  });

  say('authMsg', error
    ? error.message
    : '若此信箱已註冊，請查看重設密碼郵件。');
}

$('resetForm').addEventListener('submit', async e => {
  e.preventDefault();
  const password = $('newPassword').value;
  if (password.length < 8) {
    say('resetMsg','密碼至少需要 8 個字元。');
    return;
  }
  const {error} = await db.auth.updateUser({password});
  if (error) {
    say('resetMsg',error.message);
    return;
  }
  say('resetMsg','密碼已更新，請重新登入。');
  await db.auth.signOut();
  location.hash = '';
  $('reset').hidden = true;
  $('auth').hidden = false;
  showAuth('login');
});

async function enterApp() {
  $('auth').hidden = true;
  $('reset').hidden = true;
  $('app').style.display = 'flex';
  say('myName', user.user_metadata?.nickname || user.email);
  await loadRooms();
}

async function loadRooms() {
  const {data, error} = await db.from('room_members')
    .select('room_id, rooms(id,name,code,created_at)')
    .eq('user_id', user.id);

  if (error) {
    showNotice('載入聊天室失敗：' + error.message);
    return;
  }

  const list = $('roomList');
  list.replaceChildren();

  (data || []).forEach(item => {
    const room = item.rooms;
    if (!room) return;

    const el = document.createElement('div');
    el.className = 'room' +
      (currentRoom?.id === room.id ? ' active' : '');
    const title = document.createElement('div');
    title.textContent = room.name;
    const sub = document.createElement('small');
    sub.textContent = '代碼：' + room.code;
    el.append(title, sub);
    el.onclick = () => openRoom(room);
    list.append(el);
  });
}


async function createRoom() {
  const name = prompt('請輸入聊天室名稱');
  if (!name || !name.trim()) return;

  // 重新從 Supabase 取得目前登入的使用者
  const { data: { user: currentUser }, error: authError } =
    await db.auth.getUser();

  if (authError || !currentUser) {
    showNotice('登入狀態失效，請登出後重新登入。');
    return;
  }

  let room, error;

  for (let i = 0; i < 5; i++) {
    const result = await db.from('rooms')
      .insert({
        name: name.trim().slice(0, 80),
        code: randomCode(),
        owner_id: currentUser.id
      })
      .select()
      .single();

    if (!result.error) {
      room = result.data;
      break;
    }

    error = result.error;

    if (error.code !== '23505') break;
  }

  if (!room) {
    console.error('建立聊天室錯誤：', error);
    showNotice(
      '建立失敗：' +
      (error?.message || '請重試') +
      (error?.code ? '（代碼：' + error.code + '）' : '')
    );
    return;
  }

  const { error: joinedError } = await db
    .from('room_members')
    .insert({
      room_id: room.id,
      user_id: currentUser.id
    });

  if (joinedError) {
    console.error('加入成員錯誤：', joinedError);
    showNotice(
      '聊天室已建立，但加入失敗：' +
      joinedError.message
    );
    return;
  }

  user = currentUser;
  await loadRooms();
  await openRoom(room);
  alert('聊天室建立成功！邀請代碼：' + room.code);
}

async function joinRoom() {
  const code = prompt('請輸入朋友分享的聊天室代碼');
  if (!code || !code.trim()) return;

  const { data, error } = await db.rpc('join_room_by_code', {
    p_code: code.trim().toUpperCase()
  });

  if (error) {
    showNotice('加入失敗：' + error.message);
    return;
  }

  const room = Array.isArray(data) ? data[0] : data;

  if (!room) {
    showNotice('找不到聊天室，請檢查代碼。');
    return;
  }

  showNotice('');
  await loadRooms();
  await openRoom(room);
  alert('成功加入聊天室！');
}

async function openRoom(room) {
  currentRoom = room;
  await loadRooms();

  say('roomTitle', room.name);
  say('roomCode', '邀請代碼：' + room.code);

  $('messageInput').disabled = false;
  $('sendBtn').disabled = false;
  $('messages').replaceChildren();
  showNotice('');

  if (channel) {
    await db.removeChannel(channel);
    channel = null;
  }

  await loadMessages();

  const roomId = room.id;

  channel = db.channel('room-' + roomId)
    .on('postgres_changes', {
      event: '*',
      schema: 'public',
      table: 'messages',
      filter: 'room_id=eq.' + roomId
    }, payload => {
      if (currentRoom?.id !== roomId) return;

      if (payload.eventType === 'INSERT') {
        appendMessage(payload.new);
      }

      if (payload.eventType === 'UPDATE') {
        const updated = payload.new;
        const old = $('messages').querySelector(
          '[data-id="' + updated.id + '"]'
        );

        if (old) old.remove();
        appendMessage(updated);
      }
    })
    .subscribe(status => {
      if (status === 'CHANNEL_ERROR') {
        showNotice('即時連線失敗，請檢查 Supabase 設定。');
      }
    });
}

async function loadMessages() {
  if (!currentRoom || loadingMessages) return;

  loadingMessages = true;
  const roomId = currentRoom.id;

  try {
    const { data, error } = await db.from('messages')
      .select('id,room_id,user_id,username,content,created_at,is_deleted')
      .eq('room_id', roomId)
      .order('created_at', { ascending: true })
      .order('id', { ascending: true })
      .limit(500);

    if (error) {
      showNotice('讀取訊息失敗：' + error.message);
      return;
    }

    if (currentRoom?.id !== roomId) return;

    $('messages').replaceChildren();

    (data || []).forEach(msg => appendMessage(msg));

    scrollMessagesToBottom();
  } finally {
    loadingMessages = false;
  }
}


function scrollMessagesToBottom() {
  const box = $('messages');
  requestAnimationFrame(() => {
    box.scrollTop = box.scrollHeight;
  });
}


function appendMessage(msg) {
  if (msg.room_id !== currentRoom?.id) return;

  const existing = $('messages').querySelector(
    '[data-id="' + msg.id + '"]'
  );

  if (existing) existing.remove();

  const el = document.createElement('div');
  el.className = 'msg' + (msg.user_id === user.id ? ' mine' : '');
  el.dataset.id = msg.id;

  const meta = document.createElement('div');
  meta.className = 'meta';

  const date = new Date(msg.created_at);
  meta.textContent = (msg.username || '使用者') + ' · ' +
    date.toLocaleString('zh-TW', {
      month: '2-digit',
      day: '2-digit',
      hour: '2-digit',
      minute: '2-digit'
    });

  const content = document.createElement('div');
  content.className = 'content';
  content.textContent = msg.content || '';

  el.append(meta, content);
  $('messages').append(el);
  scrollMessagesToBottom();
}


async function logout() {
  if (channel) await db.removeChannel(channel);
  channel = null;
  currentRoom = null;
  const {error} = await db.auth.signOut();
  if (error) showNotice(error.message);
}

$('sendForm').addEventListener('submit', async e => {
  e.preventDefault();

  const content = $('messageInput').value.trim();
  if (!content || !currentRoom || !user) return;

  const roomId = currentRoom.id;
  const input = $('messageInput');
  const sendBtn = $('sendBtn');

  sendBtn.disabled = true;

  try {
    const { error } = await db.from('messages').insert({
      room_id: roomId,
      user_id: user.id,
      username: user.user_metadata?.nickname || user.email.split('@')[0],
      content
    });

    if (error) {
      showNotice('傳送失敗：' + error.message);
      return;
    }

    input.value = '';
    showNotice('');
    input.focus();

  } catch (err) {
    showNotice('傳送時發生錯誤：' + err.message);
  } finally {
    sendBtn.disabled = !currentRoom;
  }
});

init();
</script>
</body>
</html>
